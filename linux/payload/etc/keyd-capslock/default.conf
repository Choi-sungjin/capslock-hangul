# keyd-capslock config (keyd v2.6.0 + keyd-capslock.patch)
#   tap  (< 300 ms)  -> Hangul key (IBus switch-keys includes "Hangul")
#   hold (>= 300 ms) -> Caps Lock
#   dedicated Hangul key -> Right Alt
# Installed as /etc/keyd-capslock/default.conf. See README.ko.md.

[ids]

*

[global]

# Requires keyd-capslock.patch: a press and release read in the same
# millisecond counts as a tap (Hangul), not as a hold.
timeout_instant_tap = 1

[main]

# If another key is pressed before 300 ms, the tap action (hangeul) is chosen.
capslock = timeout(hangeul, 300, capslock)

# A dedicated Hangul key becomes Right Alt (same as keyd's default rightalt
# binding). keyd does not remap its own output, so the hangeul emitted by
# capslock above still reaches the input method as Hangul.
hangeul = layer(altgr)
